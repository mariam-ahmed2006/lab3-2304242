{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body">
  <h1 class="h3 mb-3">Register</h1>
  {% for e in errors %}<div class="alert alert-danger py-2 mb-2">{{ e }}</div>{% endfor %}
  <form id="register-form" method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input class="form-control mb-2" name="name" placeholder="Name" value="{{ request.form.get('name', '') }}">
    <input class="form-control mb-2" name="email" placeholder="Email" value="{{ request.form.get('email', '') }}">
    <input class="form-control mb-2" name="password" type="password" placeholder="Password">
    <input class="form-control mb-3" name="confirm_password" type="password" placeholder="Confirm password">
    <button class="btn btn-primary w-100" type="submit">Register</button>
  </form>
  <p class="mt-3 mb-0"><a href="/login">Already have an account? Log in</a></p>
</div></div>
{% endblock %}
