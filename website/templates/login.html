{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body">
  <h1 class="h3 mb-3">Login</h1>
  {% for e in errors %}<div class="alert alert-danger py-2 mb-2">{{ e }}</div>{% endfor %}
  <form id="login-form" method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input class="form-control mb-2" name="email" placeholder="Email" value="{{ request.form.get('email', '') }}">
    <input class="form-control mb-3" name="password" type="password" placeholder="Password">
    <button class="btn btn-primary w-100" type="submit">Login</button>
  </form>
  <p class="mt-3 mb-0"><a href="/register">Create an account</a></p>
</div></div>
{% endblock %}
